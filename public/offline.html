<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2a1f" />
  <title>Sin conexión · Genera Solutions SAS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f2a1f; color: #f3efe4; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    main { max-width: 420px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 1.35rem; margin: 20px 0 8px; }
    p { color: #b9c7bd; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #d4b46a; color: #0f2a1f; border: 0; border-radius: 10px;
      padding: 12px 20px; font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    small { display: block; margin-top: 28px; color: #7f9487; letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Genera Solutions SAS" />
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Las pantallas que ya abriste siguen disponibles; para cotizar, guardar o hablar con los especialistas necesitas conexión.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <small>Genera Solutions SAS</small>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
